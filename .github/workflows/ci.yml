name: CI/CD

# Se dispara en cada push a main (por si algún día se hace push directo con permisos
# de admin) y en cada Pull Request contra main — que es el flujo real que estamos
# usando desde la Fase 0, gracias a la branch protection.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite disparar el workflow a mano desde la pestaña Actions

# Permisos mínimos necesarios (principio de menor privilegio):
# - contents: read -> hace falta para "actions/checkout"
# - security-events: write -> hace falta para subir el reporte de Trivy al tab de
#   Security de GitHub ("code scanning alerts")
permissions:
  contents: read
  security-events: write

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # global-json-file hace que setup-dotnet lea la versión del SDK directamente
      # de global.json (10.0.302, rollForward: latestFeature) en vez de duplicar
      # el número de versión acá. Una sola fuente de verdad para la versión del SDK.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MonolitoMod.slnx

      - name: Build (Release)
        run: dotnet build MonolitoMod.slnx --no-restore -c Release

      # Corre las 4 pruebas del repo: 2 unitarias (Inventory, Notifications) +
      # 1 de integración (levanta la API completa vía WebApplicationFactory).
      - name: Test
        run: dotnet test MonolitoMod.slnx --no-build -c Release

  docker-scan:
    name: docker-scan
    runs-on: ubuntu-latest
    needs: build-test # no tiene sentido escanear una imagen si el código ni compila/pasa tests
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t monolitomod-api:ci .

      # Primera pasada: reporta TODAS las vulnerabilidades CRITICAL/HIGH encontradas
      # (en el SO base de la imagen y en las librerías) como SARIF, sin fallar el
      # job. El resultado queda visible en GitHub > Security > Code scanning,
      # como historial, aunque no bloquee el merge.
      - name: Trivy scan (reporte completo -> Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: monolitomod-api:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true # ignora CVEs para las que todavía no existe parche disponible
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Segunda pasada: esta es la que realmente actúa como gate del pipeline.
      # Solo falla el build ante vulnerabilidades CRITICAL con parche disponible.
      # Las HIGH quedan visibles en el Security tab (paso anterior) pero no bloquean,
      # para no frenar el aprendizaje por CVEs de la imagen base que aún no tengan fix.
      - name: Trivy scan (gate del pipeline, solo CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: monolitomod-api:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Se guarda la MISMA imagen que se acaba de escanear (no una nueva) como
      # artifact, para que el job "publish-ghcr" la publique tal cual, sin
      # reconstruirla. Evita una brecha entre "lo que se escaneó" y "lo que se
      # publica" (por ejemplo, si la imagen base :10.0 recibiera una actualización
      # entre un build y otro).
      - name: Guardar imagen ya escaneada como artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save monolitomod-api:ci -o /tmp/monolitomod-api.tar

      - name: Subir artifact de la imagen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: /tmp/monolitomod-api.tar
          retention-days: 1

  publish-ghcr:
    name: publish-ghcr
    runs-on: ubuntu-latest
    needs: docker-scan # ya implica build-test transitivamente (docker-scan depende de él)
    # Solo publica en push directo a main (post-merge), nunca desde un PR:
    # una imagen "oficial" solo debe salir de código que ya está en main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # necesario para poder hacer push al registry de paquetes (GHCR)
    steps:
      - name: Descargar la imagen ya escaneada
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: Cargar la imagen en Docker
        run: docker load -i /tmp/monolitomod-api.tar

      # GITHUB_TOKEN es un token temporal que GitHub genera automáticamente para
      # cada ejecución del workflow (expira al terminar el job) — no hace falta
      # crear ni guardar ningún secreto manualmente para autenticarse en GHCR.
      - name: Login en GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag y push
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/monolitomod-api"
          SHA_TAG="${GITHUB_SHA:0:7}"
          docker tag monolitomod-api:ci "$IMAGE:latest"
          docker tag monolitomod-api:ci "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA_TAG"
